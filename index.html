<!doctype html>
<html lang="en">
  <head>
    <script>
      try {
        const p = localStorage.getItem("cortex.theme");
        const dark =
          p === "dark" ||
          ((!p || p === "system") &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#234d40" />
    <meta
      name="description"
      content="Cortex — a little less scattered. Your personal AI, connected to your team's collective knowledge."
    />
    <title>Cortex — Your team's second brain</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
